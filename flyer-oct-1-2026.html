<style>

  header h1 { margin:0 0 4px; font-size:1.8rem; }
  header p { margin:0; font-size:1rem; opacity:.9; }

  .filter-btn { padding:8px 14px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer; font-size:.85rem; color:var(--text); transition:.15s; }
  .filter-btn.active, .filter-btn:hover { background:var(--green); border-color:var(--green); color:#fff; }
  .count { margin-left:auto; font-size:.85rem; color:var(--muted); white-space:nowrap; }
  .stores-row { display:flex; gap:16px; overflow-x:auto; padding:16px; }
  .store-col { min-width:260px; flex:0 0 auto; background:var(--card-bg); border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:12px; display:flex; flex-direction:column; }
  .store-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #eee; }
  .store-header h2 { margin:0; font-size:1.1rem; color:var(--green); }
  .store-header .dates { font-size:.75rem; color:var(--muted); }
  .card { position:relative; background:#fafafa; border:1px solid #eee; border-radius:8px; margin-bottom:10px; overflow:hidden; cursor:pointer; transition:box-shadow .15s, border-color .15s; }
  .card > * { pointer-events:none; }
  .card:hover { box-shadow:0 2px 6px rgba(0,0,0,.1); border-color:#ddd; }
  .card img { width:100%; height:150px; object-fit:cover; background:#eee; }
  .card-body { padding:10px 12px; }
  .card .name { font-weight:600; font-size:.95rem; margin-bottom:4px; }
  .card .price { font-weight:700; font-size:1.1rem; color:var(--green); margin-bottom:2px; }
  .card .detail { font-size:.8rem; color:var(--muted); margin-bottom:6px; }
  .card .category-tag { display:inline-block; font-size:.7rem; text-transform:uppercase; background:var(--green-light); color:var(--green); padding:2px 6px; border-radius:4px; margin-bottom:6px; }
  .badges { display:flex; gap:4px; flex-wrap:wrap; }
  .badge { font-size:.65rem; font-weight:600; padding:2px 6px; border-radius:4px; text-transform:uppercase; }
  .badge.organic { background:#e8f5e9; color:#2e7d32; }
  .badge.bogo { background:#fff3e0; color:#e65100; }
  .checkmark { position:absolute; top:8px; right:8px; width:24px; height:24px; border:2px solid #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; opacity:0; pointer-events:none; transition:opacity .15s, border-color .15s; }
  .card.checked .checkmark { opacity:1; border-color:var(--green); }
  .card.checked .checkmark::after { content:"✓"; color:var(--green); font-size:1rem; font-weight:bold; }
  @media (max-width:600px) {
    .stores-row { padding:12px; }
    .store-col { min-width:100%; }
  }
</style>

<style>

  .ending-row span { color:var(--muted); }

    .card { margin-bottom:6px; border-radius:5px; }

    .card-body { padding:6px; }

  }
</style>

organic": false, "frozen": false, "img": "assets/ribeye.jpg", "bogo": true}, {"store": "Winn-Dixie", "n": "Coffee mate Creamer 32 oz", "p": "2/$6", "d": "", "category": "Dairy", "date": "", "organic": false, "frozen": false, "img": "assets/sargento.png", "bogo": true}, {"store": "Aldi", "n": "Fresh Family Pack Chicken Wings", "p": "$2.49/lb", "d": "", "category": "Poultry", "date": "", "organic": false, "frozen": false, "img": "assets/turkey-wings.webp", "bogo": false}, {"store": "Aldi", "n": "Fresh St. Louis Pork Ribs", "p": "$2.49/lb", "d": "", "category": "Pork", "date": "", "organic": false, "frozen": false, "img": "assets/pork-ribs.png", "bogo": false}, {"store": "Aldi", "n": "Fresh Ground Beef Chub 5 lb", "p": "$17.95", "d": "$3.59/lb", "category": "Beef", "date": "", "organic": false, "frozen": false, "img": "assets/ground-beef.jpg", "bogo": false}, {"store": "Aldi", "n": "Fresh Seasoned Chicken Patties 16 oz", "p": "$3.99", "d": "", "category": "Poultry", "date": "", "organic": false, "frozen": false, "img": "assets/chicken.jpg", "bogo": false}, {"store": "Aldi", "n": "Fresh Seasoned Beef Skewers 7 oz", "p": "$5.99", "d": "", "category": "Beef", "date": "", "organic": false, "frozen": false, "img": "assets/beef-roast.jpg", "bogo": false}, {"store": "Aldi", "n": "Cattlemen's Ranch Frozen Black Angus Beef Patties 2 lb", "p": "$9.49", "d": "", "category": "Beef", "date": "", "organic": false, "frozen": true, "img": "assets/beef-roast.jpg", "bogo": false}, {"store": "Aldi", "n": "Fresh Organic 85/15 Grass-Fed Ground Beef", "p": "$5.99/lb", "d": "", "category": "Beef", "date": "", "organic": true, "frozen": false, "img": "assets/ground-beef.jpg", "bogo": false}, {"store": "Aldi", "n": "Large Pumpkins", "p": "$3.95", "d": "", "category": "Produce", "date": "", "organic": false, "frozen": false, "img": "assets/baby-carrots.png", "bogo": false}, {"store": "Aldi", "n": "Honeycrisp Apples, 2-lb bag", "p": "$1.99", "d": "", "category": "Produce", "date": "", "organic": false, "frozen": false, "img": "assets/apples.png", "bogo": false}, {"store": "Aldi", "n": "Green Grapes", "p": "$1.29/lb", "d": "", "category": "Produce", "date": "", "organic": false, "frozen": false, "img": "assets/grapes.jpg", "bogo": false}, {"store": "Aldi", "n": "Butternut, Delicata or Spaghetti Squash", "p": "$0.89/lb", "d": "", "category": "Produce", "date": "", "organic": false, "frozen": false, "img": "assets/squash.jpg", "bogo": false}, {"store": "Aldi", "n": "Multi-Colored Peppers, 3 ct", "p": "$2.49", "d": "", "category": "Produce", "date": "", "organic": false, "frozen": false, "img": "assets/avocado.jpg", "bogo": false}, {"store": "Aldi", "n": "Baby Bella Mushrooms, 8 oz", "p": "$1.29", "d": "", "category": "Produce", "date": "", "organic": false, "frozen": false, "img": "assets/baby-carrots.png", "bogo": false}];
</script>
<script>
(function () {
  const searchInput = document.getElementById('searchInput');
  const filterButtons = document.querySelectorAll('.filter-btn');
  const liveCount = document.getElementById('liveCount');
  const storesRow = document.getElementById('storesRow');
  const checked = new Set();
  let searchTerm = '';
  let activeFilter = 'All';
  let imageCheckGeneration = 0;

  const categoryOrder = ["Beef", "Pork", "Poultry", "Seafood", "Eggs", "Dairy", "Produce", "Lamb", "Plant-Based"];

  function isBOGO(deal) { return deal.bogo===true || /\bBOGO\b|buy-one-get-50%-off/i.test(deal.d + ' ' + deal.p); }
  function isMulti(deal) { return isBOGO(deal) || /multi-buy|\d+\s*for\s*\$|\d+\s*\/\s*\$/i.test(deal.d + ' ' + deal.p); }
  function savingsValue(deal) {
    const m = deal.d.match(/save\s*\$(\d+(?:\.\d+)?)/i);
    return m ? Number(m[1]) : 0;
  }
  function matchesFilter(deal, idx) {
    const haystack = (deal.n+' '+deal.store+' '+deal.category+' '+deal.p+' '+deal.d).toLowerCase();
    if (searchTerm && !haystack.includes(searchTerm)) return false;
    if (activeFilter === 'BOGO') return isBOGO(deal);
    if (activeFilter === 'Organic') return deal.organic;
    if (activeFilter === 'My List') return checked.has(idx);
    return true;
  }
  function filteredDeals() {
    return DEALS.map((deal,idx)=>({deal,idx})).filter(x=>matchesFilter(x.deal,x.idx));
  }
  function displayCategories(deal) {
    const categories=[deal.category];
    const name=deal.n.toLowerCase();
    if (name.includes('lamb ')) categories.splice(0,categories.length,'Lamb');
    if (name.includes('impossible') || name.includes('beyond meat')) categories.splice(0,categories.length,'Plant-Based');
    if (/beef or chicken/.test(name)) categories.push('Poultry');
    if (/pork or chicken/.test(name)) categories.push('Poultry');
    if (/turkey sausage.*bacon|turkey bacon.*sausage/.test(name)) categories.push('Pork');
    if (/cheese or turkey/.test(name)) categories.push('Poultry');
    if (/eggs.*butter/.test(name)) categories.push('Dairy');
    return Array.from(new Set(categories));
  }
  function unitPrice(deal) {
    const p = deal.p.trim();
    let m = p.match(/^(\d+)\s*\/\s*\$(\d+(?:\.\d+)?)$/);
    if (m) return '$'+(Number(m[2])/Number(m[1])).toFixed(2)+' each';
    m = p.match(/^(\d+)\s+for\s+\$(\d+(?:\.\d+)?)$/i);
    if (m) return '$'+(Number(m[2])/Number(m[1])).toFixed(2)+' each';
    m = p.match(/^(\d+)\s+lbs?\s+for\s+\$(\d+(?:\.\d+)?)$/i);
    if (m) return '$'+(Number(m[2])/Number(m[1])).toFixed(2)+'/lb';
    if (/\/lb/i.test(p)) return p;
    if (/\bea\.?$/i.test(p)) return p.replace(/\s*ea\.?$/i,'')+' each';
    if (/no price|price not stated/i.test(p)) return 'Not published';
    if (/buy-one-get-50%-off/i.test(p)) return 'Second item 50% off';
    if (isBOGO(deal) && /^\$\d/.test(p)) {
      const val=Number((p.match(/\d+(?:\.\d+)?/)||[])[0]);
      return val ? '$'+(val/2).toFixed(2)+' each when buying 2' : p;
    }
    return p+' per listed package';
  }
  function totalPrice(deal) {
    const p=deal.p.trim();
    let m=p.match(/^(\d+)\s*\/\s*\$(\d+(?:\.\d+)?)$/);
    if (m) return '$'+m[2]+' for '+m[1];
    m=p.match(/^(\d+)\s+for\s+\$(\d+(?:\.\d+)?)$/i);
    if (m) return '$'+m[2]+' for '+m[1];
    m=p.match(/^(\d+)\s+lbs?\s+for\s+\$(\d+(?:\.\d+)?)$/i);
    if (m) return '$'+m[2]+' for '+m[1]+' lbs';
    if (/\/lb/i.test(p)) return p+' (total varies by weight)';
    if (isBOGO(deal) && /^\$\d/.test(p)) return p+' for 2';
    return p;
  }
  function numericUnit(deal) {
    const u=unitPrice(deal);
    const m=u.match(/\$(\d+(?:\.\d+)?)/);
    return m ? Number(m[1]) : Infinity;
  }
  function lowestIndices() {
    const lows=new Set();
    STORE_ORDER.forEach(store=>{
      ['Beef','Pork','Poultry','Seafood','Dairy','Eggs','Produce'].forEach(cat=>{
        const pool=DEALS.map((d,i)=>({d,i})).filter(x=>x.d.store===store && x.d.category===cat && !isMulti(x.d) && Number.isFinite(numericUnit(x.d)));
        if (!pool.length) return;
        const min=Math.min(...pool.map(x=>numericUnit(x.d)));
        pool.filter(x=>numericUnit(x.d)===min).forEach(x=>lows.add(x.i));
      });
    });
    return lows;
  }
  const lowSet=lowestIndices();

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function updateCount() {
    liveCount.textContent = 'Showing '+filteredDeals().length+' of '+DEALS.length+' deals · '+checked.size+' selected';
  }
  async function verifyRenderedImages() {
    const generation=++imageCheckGeneration;
    const images=Array.from(storesRow.querySelectorAll('img'));
    storesRow.setAttribute('aria-busy','true');
    await Promise.all(images.map(img=>img.decode().catch(()=>{})));
    if (generation!==imageCheckGeneration) return;
    const loaded=images.filter(img=>img.complete && img.naturalWidth>0 && img.naturalHeight>0);
    const aldiImages=images.filter(img=>img.closest('.store-col')?.dataset.store==='Aldi');
    const aldiLoaded=aldiImages.filter(img=>img.complete && img.naturalWidth>0 && img.naturalHeight>0);
    storesRow.setAttribute('aria-label','Store deals. Image check: '+loaded.length+' of '+images.length+' loaded with dimensions; Aldi '+aldiLoaded.length+' of '+aldiImages.length+'.');
    storesRow.setAttribute('aria-busy','false');
  }
  function makeCard(deal, idx) {
    const card=document.createElement('div');
    card.className='card'+(checked.has(idx)?' checked':'')+((isMulti(deal)||savingsValue(deal)>=5)?' hot':'');
    card.dataset.idx=idx;
    card.tabIndex=0;
    card.setAttribute('role','button');
    card.setAttribute('aria-pressed',checked.has(idx)?'true':'false');
    card.setAttribute('aria-label',(checked.has(idx)?'Remove ':'Add ')+deal.n+(checked.has(idx)?' from':' to')+' My List');
    let badges='';
    if (deal.organic) badges+='<span class="badge organic">Organic</span>';
    if (isBOGO(deal)) badges+='<span class="badge bogo">BOGO</span>';
    else if (isMulti(deal)) badges+='<span class="badge bogo">Multi-buy</span>';
    if (deal.frozen) badges+='<span class="badge frozen">Frozen</span>';
    if (deal.date) badges+='<span class="badge date">'+escapeHtml(deal.date)+'</span>';
    if (lowSet.has(idx)) badges+='<span class="badge low">Lowest published price</span>';
    card.innerHTML='<img src="'+escapeHtml(deal.img)+'" alt="'+escapeHtml(deal.n)+'" loading="eager" decoding="async">'+
      '<div class="card-body"><div class="name">'+escapeHtml(deal.n)+'</div>'+
      '<div class="price-line primary"><span>Total</span><strong>'+escapeHtml(totalPrice(deal))+'</strong></div>'+
      '<div class="price-line"><span>Per unit</span><strong>'+escapeHtml(unitPrice(deal))+'</strong></div>'+
      (deal.d?'<div class="detail">'+escapeHtml(deal.d)+'</div>':'')+
      '<div class="category-tag">'+escapeHtml(isBOGO(deal)?'BOGO Deal':deal.category)+'</div><div class="badges">'+badges+'</div></div><div class="checkmark"></div>';
    function toggle(){ checked.has(idx)?checked.delete(idx):checked.add(idx); render(); }
    card.addEventListener('click',toggle);
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} });
    return card;
  }
  function render() {
    updateCount();
    storesRow.innerHTML='';
    const visible=filteredDeals();

    categoryOrder.forEach(category=>{
      const categoryDeals=visible.filter(x=>displayCategories(x.deal).includes(category));
      if (!categoryDeals.length) return;

      const block=document.createElement('section');
      block.className='category-block';
      block.setAttribute('aria-labelledby','category-'+category.toLowerCase());
      block.innerHTML='<div class="category-heading"><h2 id="category-'+category.toLowerCase()+'">'+escapeHtml(category)+'</h2><span>'+categoryDeals.length+' deal'+(categoryDeals.length===1?'':'s')+'</span></div><div class="category-store-grid"></div>';
      const grid=block.querySelector('.category-store-grid');

      STORE_ORDER.forEach(store=>{
        const group=categoryDeals.filter(x=>x.deal.store===store);
        const meta=STORE_META[store];
        const storeSection=document.createElement('section');
        storeSection.className='category-store store-col';
        storeSection.dataset.store=store;
        storeSection.innerHTML='<div class="store-header"><h3>'+escapeHtml(store)+'</h3><div class="store-meta"><span class="dates">'+escapeHtml(meta.dates)+'</span></div></div><div class="cards"></div>';
        const cards=storeSection.querySelector('.cards');
        if (group.length) group.forEach(x=>cards.appendChild(makeCard(x.deal,x.idx)));
        else cards.innerHTML='<p class="empty-category">No deals this week</p>';
        grid.appendChild(storeSection);
      });

      storesRow.appendChild(block);
    });

    if (!visible.length) {
      const empty=document.createElement('p');
      empty.className='empty-results';
      empty.textContent=activeFilter==='My List' ? 'Your list is empty. Tap any deal to add it.' : 'No deals match this search.';
      storesRow.appendChild(empty);
    }
    verifyRenderedImages();
  }
  searchInput.addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();render();});
  filterButtons.forEach(btn=>btn.addEventListener('click',()=>{activeFilter=btn.dataset.filter;filterButtons.forEach(b=>b.classList.toggle('active',b===btn));render();}));
  render();
})();
</script>
